name: Generals News Bot

on:
  schedule:
    - cron: "13 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kerakli kutubxonani o'rnatish
        run: pip install requests pillow

      - name: Kirill shriftini o'rnatish
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generals_news_bot.py

      - name: Oxirgi yuborilgan versiyani saqlab qo'yish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_release.txt
          git diff --staged --quiet || git commit -m "Oxirgi yuborilgan release yangilandi"
          git push
